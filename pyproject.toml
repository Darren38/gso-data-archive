[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gso-archive"
version = "5.11.1"
description = "Historical archive, collector and dashboard for Malaysian Grid System Operator (GSO) public data"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
gso-archive = "gso_archive.cli:main"

[tool.setuptools.packages.find]
include = ["gso_archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
