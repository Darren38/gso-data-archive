# Publishes the dashboard + a static JSON snapshot of the archive to GitHub Pages.
#
# Uses secret API_DATABASE_URL (read-only role recommended), falling back to DATABASE_URL.
# Without a database secret it publishes the clearly-watermarked DEMONSTRATION
# dataset so the site is reachable from day one (set repository variable
# PAGES_ALLOW_DEMO to "false" to publish nothing instead). As soon as a database
# secret exists, real archived data is published and the demo is never used.
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Publish dashboard to Pages

on:
  push:
    branches: [main]
    paths: ["Version 1/web/**", "Version 1/gso_archive/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "17 * * * *"   # hourly snapshot
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "Version 1"
    env:
      DB: ${{ secrets.API_DATABASE_URL || secrets.DATABASE_URL }}
      ALLOW_DEMO: ${{ vars.PAGES_ALLOW_DEMO || 'true' }}
    outputs:
      ready: ${{ steps.cfg.outputs.ready }}
    steps:
      - id: cfg
        working-directory: .
        run: |
          if [ -n "$DB" ]; then echo "mode=archive" >> "$GITHUB_OUTPUT"; echo "ready=true" >> "$GITHUB_OUTPUT";
          elif [ "$ALLOW_DEMO" = "true" ]; then echo "mode=demo" >> "$GITHUB_OUTPUT"; echo "ready=true" >> "$GITHUB_OUTPUT";
          else echo "No database secret and PAGES_ALLOW_DEMO=false — nothing to publish."; echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - if: steps.cfg.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Export archive snapshot
        if: steps.cfg.outputs.mode == 'archive'
        env:
          DATABASE_URL: ${{ env.DB }}
        # Static mode only reads; the role behind API_DATABASE_URL should be read-only.
        run: python -m gso_archive export-static --out ../_site
      - name: Export DEMO snapshot (watermarked, not GSO data)
        if: steps.cfg.outputs.mode == 'demo'
        run: |
          python -m gso_archive seed-demo --database-url "sqlite:///$RUNNER_TEMP/demo.sqlite3" --days 90
          DATABASE_URL="sqlite:///$RUNNER_TEMP/demo.sqlite3" python -m gso_archive export-static --out ../_site
      - uses: actions/upload-pages-artifact@v3
        if: steps.cfg.outputs.ready == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
