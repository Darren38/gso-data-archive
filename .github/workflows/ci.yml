name: CI

on:
  push:
    paths: ["Version */**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["Version */**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "Version 2"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gso
          POSTGRES_PASSWORD: gso_ci_pw
          POSTGRES_DB: gso_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gso" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Version 2/requirements.txt"
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Install Playwright (frontend state tests)
        working-directory: "Version 2/tests/frontend"
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://gso:gso_ci_pw@localhost:5432/gso_test
        run: python -m pytest -q --ignore=tests/test_frontend.py
