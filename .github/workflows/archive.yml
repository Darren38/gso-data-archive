# Collects new GSO readings and publishes the dashboard to GitHub Pages — no server and no database service needed.
#
# Runs continuously: each run starts the next one about a minute after it finishes (the "next" job), so new readings
# arrive every 2–3 minutes. GitHub's own schedule often starts late or not at all (this repository had none for the
# first hour), so the schedules below are only a backup that restarts the chain if it ever stops. Also runs on every
# push to main and on demand (Actions tab > "Collect and publish" > Run workflow; tick "probe" to look at GSO's pages).
# The site measures and shows the real interval on its "Auto" label.
# Each run:
#   - picks up the archive (one SQLite file) saved by the previous run in the Actions cache, and also merges in the copy
#     published on the live site (data/archive.sqlite3.gz) in case the cache was cleared — the same idea as Tech
#     Comparison Hub's seed_live.py. Copies are merged, never swapped, so nothing can be rolled back.
#   - collects today's readings, re-checks yesterday about once an hour for late or corrected readings, and fetches days
#     that were missed (on by default; repository variable GSO_LIVE_ENABLED=false pauses it)
#   - saves the archive for the next run, builds the site and publishes it
# After publishing, a check-up reads the live site and fails the run (GitHub then emails the owner) when the page doesn't
# load or collection has stopped. Once a day the archive is also copied to the "archive-backups" GitHub Release
# (outside the git history), and the daily run keeps the schedule switched on.
#
# GitHub may start scheduled runs late or skip some when it is busy. No readings are lost: every request returns the
# whole day, and missed days are fetched again automatically.
#
# Optional: secret DATABASE_URL to keep the archive in your own PostgreSQL instead of the Actions cache.
name: Collect and publish

on:
  push:
    branches: [main]
    paths: ["gso_archive/**", "web/**", "requirements.txt", ".github/workflows/archive.yml"]
  schedule:
    - cron: "*/5 * * * *"    # collect and publish (five staggered schedules = about every minute)
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
    - cron: "43 19 * * *"  # daily, 03:43 Malaysia time: backup to a GitHub Release + keep the schedule switched on
  workflow_dispatch:
    inputs:
      probe:
        description: "Also look at GSO's pages and log which data addresses they use"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One build at a time, never stopped half way; the next one waits its turn (GitHub keeps one waiting).
    concurrency:
      group: archive-build
      cancel-in-progress: false
    env:
      EXTERNAL_DB: ${{ secrets.DATABASE_URL }}
      # Collecting from gso.org.my is on (the owner's decision); set repository variable GSO_LIVE_ENABLED=false to pause.
      GSO_LIVE_ENABLED: ${{ vars.GSO_LIVE_ENABLED || 'true' }}
      GSO_ADAPTERS: ${{ vars.GSO_ADAPTERS || 'generation_mix,system_demand,tieline_egat,tieline_hvdc,tieline_pltg,power_station,solar_profile,solar_forecast,genmix_live,other_re,headlines,availability,solar_farms' }}
      GSO_COLLECTION_MODE: github
      COLLECT_INTERVAL_SECONDS: "60"  # what the schedule asks for; the site shows the measured interval
      RAW_RETENTION: none  # the runner's disk is thrown away after each run
      ALLOW_DEMO: ${{ vars.PAGES_ALLOW_DEMO || 'true' }}
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    outputs:
      store: ${{ steps.store.outputs.store }}
      key: ${{ steps.store.outputs.key }}
      artifact_id: ${{ steps.site.outputs.artifact_id }}
    steps:
      # Every action is pinned to an exact commit, and the checkout keeps no GitHub token (this job never pushes),
      # so the collector and the sites it reads can't use the repository's credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: Where the archive is kept
        id: store
        run: |
          if [ -n "$EXTERNAL_DB" ]; then
            echo "store=external" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL=$EXTERNAL_DB" >> "$GITHUB_ENV"
          else
            echo "store=github" >> "$GITHUB_OUTPUT"
            echo "DATABASE_URL=sqlite:///$GITHUB_WORKSPACE/archive-store/archive.sqlite3" >> "$GITHUB_ENV"
          fi
          echo "key=archive-db-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Pick up the archive saved by the previous run
        if: steps.store.outputs.store == 'github'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: archive-store
          key: ${{ steps.store.outputs.key }}
          restore-keys: archive-db-
      - name: Merge in the archive from the live site (in case the cache was cleared)
        if: steps.store.outputs.store == 'github'
        run: python -m gso_archive seed-live --base "$SITE_URL"
        continue-on-error: true
      - run: python -m gso_archive migrate
      - name: Collect new readings (today, yesterday's corrections, missed days)
        if: env.GSO_LIVE_ENABLED == 'true'
        run: python -m gso_archive collect
        continue-on-error: true  # a source that fails is recorded on the Status page; the site still publishes
      - name: Save the archive for the next run
        if: steps.store.outputs.store == 'github'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: archive-store
          key: ${{ steps.store.outputs.key }}
      - name: Build the site
        run: |
          python -m gso_archive export-static --out _site $([ "$ALLOW_DEMO" = "true" ] && echo --demo-if-empty)
          touch _site/.nojekyll
      - id: site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    concurrency:
      group: archive-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
      contents: write  # only to make each run's commit object (on no branch) that names its deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.deployment.outcome == 'success' }}
    steps:
      # Until Pages is switched on (Settings > Pages > Source: GitHub Actions) the deploy is skipped with a warning
      # instead of failing, so the owner isn't emailed every few minutes before setup is finished.
      - name: Is GitHub Pages switched on?
        id: pages
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then echo "on=true" >> "$GITHUB_OUTPUT";
          else echo "on=false" >> "$GITHUB_OUTPUT"; echo "::warning::GitHub Pages is not switched on yet. Settings > Pages > Source: GitHub Actions. The site will publish on the next run after that."; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pages.outputs.on == 'true'
        with:
          persist-credentials: false
          sparse-checkout: scripts
      # Not actions/deploy-pages: it names every deployment after the commit, and this site is republished every few
      # minutes from the same commit, so GitHub kept serving one old copy while reporting success (29 Oct 2026).
      # GitHub only accepts a commit as the name, so scripts/deploy_pages.py makes a commit object for each run (same
      # files, on no branch, never in the history), publishes under it and waits until that copy is live.
      - id: deployment
        if: steps.pages.outputs.on == 'true'
        run: python3 scripts/deploy_pages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}

  # A check-up of the live site, once an hour (and after a push or a manual run) so a broken source means one email an
  # hour, not one per run. It only reads the site. A failure marks the run red, so GitHub emails the owner; the details
  # are on the run's summary page.
  check:
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: Check the live site
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "$(date -u +%M)" -ge 6 ]; then echo "Checked once an hour; not this run."; exit 0; fi
          sleep 30
          python -m gso_archive health-check --base "$SITE_URL" --max-age-minutes 60

  # Tells Bing and other search engines (IndexNow) that the site changed. The data changes every few minutes but the page
  # itself only when the code does, so this runs only after a push has been published. It waits until the new page is
  # live, sends the one address, and never fails the run: telling search engines is a courtesy.
  indexnow:
    needs: deploy
    if: github.event_name == 'push' && needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: indexnow
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tell search engines the site changed (IndexNow; Bing, Yandex and others)
        run: python3 scripts/indexnow.py submit

  # Looks at GSO's own pages from GitHub's servers: which data addresses each page really uses, what they answer and
  # with which fields. Runs after a push, once a day and on demand; the findings are in the log and kept as an artifact
  # (14 days) so the collectors can be checked against the real site.
  probe:
    if: github.event_name == 'push' || inputs.probe || github.event.schedule == '43 19 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GSO_LIVE_ENABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: Look at GSO's pages
        run: |
          python -m gso_archive probe --out probe-out > probe.json || true
          python scripts/probe_summary.py probe.json probe-out
        continue-on-error: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gso-probe-${{ github.run_id }}
          path: probe-out
          retention-days: 14

  # Keeps collection going without waiting for GitHub's schedule: about a minute after this run's collection, start the
  # next run. Only one chain ever runs: if a newer run is already queued or running, this one steps aside.
  next:
    needs: build
    if: always() && github.ref == 'refs/heads/main' && needs.build.result != 'cancelled' && vars.GSO_LIVE_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Start the next collection in about a minute
        run: |
          sleep 60
          newer=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/archive.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.id > ${{ github.run_id }} and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\"))] | length")
          if [ "${newer:-0}" -gt 0 ]; then echo "A newer run is already on its way."; exit 0; fi
          gh workflow run archive.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Next run started."
        env:
          GH_TOKEN: ${{ github.token }}

  # Only the newest saved archives are kept in the Actions cache (each run saves a new one).
  tidy:
    needs: build
    if: needs.build.outputs.store == 'github'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Remove older saved archives from the cache
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key archive-db- --sort created_at --order desc --limit 100 \
            --json id --jq '.[3:][].id' | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # Daily copy of the whole archive to the "archive-backups" release: release files live outside the git history and
  # are kept until deleted. The newest 14 days are kept, plus the copy from the 1st of every month, forever.
  backup:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      EXTERNAL_DB: ${{ secrets.DATABASE_URL }}
      GH_TOKEN: ${{ github.token }}
      BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --quiet -r requirements.txt
      - name: Already backed up today?
        id: today
        run: |
          if gh release view archive-backups --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null \
             | grep -q "gso-archive-$(date -u +%F).tar.gz"; then echo "done=true" >> "$GITHUB_OUTPUT"; echo "Today's backup exists."; fi
      - name: Pick up this run's archive
        if: needs.build.outputs.store == 'github' && steps.today.outputs.done != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: archive-store
          key: ${{ needs.build.outputs.key }}
      - name: Make the backup (checksummed CSV per table, restorable into SQLite or PostgreSQL)
        if: steps.today.outputs.done != 'true'
        run: |
          if [ -n "$EXTERNAL_DB" ]; then export DATABASE_URL="$EXTERNAL_DB"; else export DATABASE_URL="sqlite:///$GITHUB_WORKSPACE/archive-store/archive.sqlite3"; fi
          [ -n "$EXTERNAL_DB" ] || [ -f "$GITHUB_WORKSPACE/archive-store/archive.sqlite3" ] || { echo "No archive yet - nothing to back up."; exit 0; }
          python -m gso_archive backup --format portable --out "$RUNNER_TEMP/bk"
          cd "$RUNNER_TEMP/bk" && tar czf "$RUNNER_TEMP/gso-archive-$(date -u +%F).tar.gz" gso-archive-portable-*
      - name: Upload to the archive-backups release
        if: steps.today.outputs.done != 'true'
        run: |
          FILE=$(ls "$RUNNER_TEMP"/gso-archive-*.tar.gz 2>/dev/null | head -1)
          [ -n "$FILE" ] || exit 0
          R="--repo $GITHUB_REPOSITORY"
          gh release view archive-backups $R >/dev/null 2>&1 || gh release create archive-backups $R --latest=false \
            --title "Archive backups" --notes "Daily copies of the GSO archive. Restore with: python -m gso_archive restore-portable <folder>"
          gh release upload archive-backups "$FILE" --clobber $R
          gh release view archive-backups $R --json assets --jq '.assets[].name' | sort -r | awk 'NR>14 && !/-01\.tar\.gz$/' \
            | xargs -r -n1 gh release delete-asset archive-backups -y $R
      - name: Also copy to your own object storage (optional)
        if: env.BACKUP_S3_URI != '' && steps.today.outputs.done != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
        run: aws s3 cp "$RUNNER_TEMP"/gso-archive-*.tar.gz "$BACKUP_S3_URI/" ${ENDPOINT:+--endpoint-url "$ENDPOINT"}

  # GitHub switches off scheduled workflows in a public repository after 60 days without a push. Once a day this job
  # uses GitHub's own "enable workflow" switch, which keeps it on without any commit.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '43 19 * * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled updates switched on
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/archive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
