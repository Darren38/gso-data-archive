# Scheduled collection on GitHub Actions — the zero-server option.
#
# Trade-offs (see "Version 1/docs/DEPLOYMENT.md"):
# * GitHub delays scheduled runs (often 5–30 min under load) and may skip some.
#   No data is lost by that: each request returns the whole day, and the
#   collector automatically re-checks yesterday and back-fills missed days.
# * Runners are outside Malaysia; GSO may block or rate-limit them.
# * The cron below is GitHub's own schedule and cannot read COLLECT_INTERVAL_SECONDS;
#   that variable configures the always-on worker (`python -m gso_archive schedule`).
# * Schedules only run on the default branch, and GitHub pauses them after
#   60 days without repository activity (public repos).
#
# Required:  secret DATABASE_URL (external PostgreSQL, e.g. Neon/Supabase/RDS).
# Optional:  variables GSO_LIVE_ENABLED, GSO_ADAPTERS, GSO_USER_AGENT.
# Nothing runs until DATABASE_URL is set and GSO_LIVE_ENABLED is "true".
name: Collect GSO data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gso-collect
  cancel-in-progress: false   # never kill a run mid-transaction; the next waits

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "Version 1"
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GSO_LIVE_ENABLED: ${{ vars.GSO_LIVE_ENABLED || 'false' }}
      GSO_ADAPTERS: ${{ vars.GSO_ADAPTERS }}
      GSO_USER_AGENT: ${{ vars.GSO_USER_AGENT }}
      # Runner disks are ephemeral; raw responses need the worker deployment or object storage.
      RAW_RETENTION: none
    steps:
      - name: Check configuration
        id: cfg
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret not set — skipping."; echo "ready=false" >> "$GITHUB_OUTPUT";
          elif [ "$GSO_LIVE_ENABLED" != "true" ]; then echo "GSO_LIVE_ENABLED is not true — skipping."; echo "ready=false" >> "$GITHUB_OUTPUT";
          else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Version 1/requirements.txt"
      - if: steps.cfg.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - if: steps.cfg.outputs.ready == 'true'
        run: python -m gso_archive migrate
      - name: Collect one cycle
        if: steps.cfg.outputs.ready == 'true'
        run: python -m gso_archive collect
