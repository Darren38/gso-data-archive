# Daily off-site backup of the archive database (portable gzip-CSV format, checksummed).
#
# Required: secret DATABASE_URL.
# Optional off-site copy to S3-compatible storage (AWS S3, Cloudflare R2, Backblaze B2):
#   secrets BACKUP_S3_URI (e.g. s3://my-bucket/gso-archive), AWS_ACCESS_KEY_ID,
#   AWS_SECRET_ACCESS_KEY, optional variable BACKUP_S3_ENDPOINT (for R2/B2).
# The GitHub artifact is a convenience copy only (expires after 90 days).
name: Backup archive

on:
  schedule:
    - cron: "43 19 * * *"   # 03:43 MYT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "Version 1"
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
    steps:
      - id: cfg
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL not set — skipping."; echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - if: steps.cfg.outputs.ready == 'true'
        run: pip install -r requirements.txt
      - name: Portable backup
        if: steps.cfg.outputs.ready == 'true'
        run: python -m gso_archive backup --format portable --out "$RUNNER_TEMP/backups"
      - name: Copy to object storage
        if: steps.cfg.outputs.ready == 'true' && env.BACKUP_S3_URI != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
        run: aws s3 cp --recursive "$RUNNER_TEMP/backups" "$BACKUP_S3_URI/" ${ENDPOINT:+--endpoint-url "$ENDPOINT"}
      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          name: gso-archive-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backups
          retention-days: 90
